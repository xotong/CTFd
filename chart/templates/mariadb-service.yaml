{{- if .Values.mariadb.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ctfd.mariadb.fullname" . }}
  labels:
    {{- include "ctfd.mariadb.labels" . | nindent 4 }}
spec:
  type: {{ .Values.mariadb.service.type }}
  ports:
    - port: {{ .Values.mariadb.service.port }}
      targetPort: mysql
      protocol: TCP
      name: mysql
  selector:
    {{- include "ctfd.mariadb.selectorLabels" . | nindent 4 }}
{{- end }}
